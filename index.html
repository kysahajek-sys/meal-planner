<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --ink:#0f201c; --ink-2:#23392f; --paper:#e9ede6; --tile:#ffffff;
  --line:#ccd6cd; --line-soft:#e2e8e1;
  --amber:#d79a13; --amber-ink:#8a6206; --amber-soft:#fdf3dc; --amber-tint:#fdf7e9;
  --paprika:#a63b2b; --paprika-soft:#f9e9e5;
  --sage:#7d9c86; --sage-soft:#eaf0ea; --muted:#67786f;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}

header{background:var(--ink);color:#eef3ee;padding:26px 0 0}
.head-in{max-width:1180px;margin:0 auto;padding:0 20px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.02em;margin:0;color:#fff}
.brand p{margin:0;color:#9fb6a8;font-size:13.5px;max-width:44ch}
.langs{display:flex;gap:0;border:1px solid rgba(255,255,255,.25);border-radius:9px;overflow:hidden;flex:none}
.langs button{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;background:transparent;border:0;color:#9fb6a8;padding:7px 12px;cursor:pointer}
.langs button:hover{color:#fff}
.langs button[aria-pressed="true"]{background:#fff;color:var(--ink)}
nav{display:flex;gap:4px;margin-top:22px;flex-wrap:wrap}
nav button{font-family:var(--display);font-weight:700;font-size:13.5px;background:transparent;border:0;color:#9fb6a8;cursor:pointer;padding:10px 16px;border-radius:9px 9px 0 0}
nav button:hover{color:#fff;background:rgba(255,255,255,.07)}
nav button[aria-selected="true"]{background:var(--paper);color:var(--ink)}
:focus-visible{outline:2.5px solid var(--amber);outline-offset:2px}

h2{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;margin:0 0 4px}
h3{font-family:var(--display);font-weight:700;font-size:15px;margin:0 0 8px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 18px}
.card{background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:26px 0 14px}
.btn{font-family:var(--display);font-weight:700;font-size:13.5px;background:var(--ink);color:#fff;border:1px solid var(--ink);padding:9px 15px;border-radius:9px;cursor:pointer}
.btn:hover{background:var(--ink-2)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:#fff;border-color:var(--ink)}
.btn.small{padding:6px 11px;font-size:12.5px}
.btn.danger{background:transparent;color:var(--paprika);border-color:var(--line)}
.btn.danger:hover{background:var(--paprika-soft);border-color:var(--paprika)}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin:0 0 5px}
input[type=text],input[type=number],input[type=date],select,textarea{font-family:var(--body);font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{font-size:14px;line-height:1.6;resize:vertical}
textarea.mono{font-family:var(--mono);font-size:13px;line-height:1.7}
.field{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 16px}
.hint{font-size:12px;color:var(--muted);margin-top:5px}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:30px 22px;text-align:center;color:var(--muted);background:rgba(255,255,255,.5)}
.empty strong{display:block;font-family:var(--display);font-size:17px;color:var(--ink);margin-bottom:5px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.wd-set{display:flex;gap:6px;flex-wrap:wrap}
.wd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:8px;padding:8px 0;cursor:pointer;width:48px;text-align:center}
.wd[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.wd.shop[aria-pressed="true"]{background:var(--paprika);border-color:var(--paprika)}

.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:8px}
.strip div{background:var(--tile);padding:13px 15px}
.strip .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.strip .v{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em}

.cal-head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin:18px 0 8px}
.cal-head span{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);padding-left:2px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.tile{background:var(--tile);border:1px solid var(--line-soft);border-radius:12px;padding:24px 9px 10px;min-height:104px;min-width:0;position:relative;display:flex;flex-direction:column;gap:6px}
.tile.pad{background:transparent;border:0;min-height:0}
.tile.hascook{background:var(--amber-tint);border-color:var(--amber);box-shadow:inset 3px 0 0 var(--amber)}
.tile .date{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.today{outline:2px solid var(--ink)}
.tile.today .date{color:var(--ink);font-weight:500}
.notch{position:absolute;top:-1px;left:-1px;background:var(--paprika);color:#fff;font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:11px 0 11px 0}
.notch.small{background:var(--paprika-soft);color:var(--paprika);border:1px dashed var(--paprika)}
.notch.stock{left:auto;right:-1px;border-radius:0 11px 0 11px;background:var(--sage);color:#fff;cursor:pointer;padding:3px 7px}
/* ---------- next up ---------- */
.nextup{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:22px}
.nu{background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.nu .eyebrow{color:var(--ink)}

/* ---------- week ---------- */
.weeknav{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.wlabel{font-family:var(--mono);font-size:12px;color:var(--muted);flex:1;min-width:150px}
.week{display:flex;flex-direction:column;gap:8px}
.drow{display:flex;gap:14px;align-items:flex-start;background:var(--tile);
  border:1px solid var(--line-soft);border-radius:12px;padding:11px 14px;
  box-shadow:inset 3px 0 0 var(--line-soft)}
.drow.iscook{background:var(--amber-tint);border-color:var(--amber);box-shadow:inset 3px 0 0 var(--amber)}
.drow.today{outline:2px solid var(--ink)}
.dside{width:186px;flex:none;display:flex;flex-direction:column;justify-content:center;gap:6px}
.dwhen{width:74px;flex:none;display:flex;flex-direction:column;line-height:1.25}
.dwd{font-family:var(--display);font-weight:700;font-size:14px}
.dnum{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.dmeals{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}

/* ---------- one meal line ---------- */
.mrow{display:flex;align-items:center;gap:10px;width:100%;height:28px;text-align:left;background:transparent;
  border:0;padding:0 6px;border-radius:7px;font:inherit;color:inherit;overflow:hidden}
button.mrow{cursor:pointer}
button.mrow:hover{background:rgba(15,32,28,.06)}
.mrow .mslot{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted);width:66px;flex:none}
.mrow .mname{font-size:14px;color:var(--ink-2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow.cook .mname{font-family:var(--display);font-weight:700;color:var(--ink)}
.mrow.cold .mname{color:var(--ink-2)}
.mrow.again .mname,.mrow.none .mname{color:var(--muted)}
.mrow .mbadge{font-family:var(--mono);font-size:10.5px;color:var(--amber-ink);background:var(--amber-soft);
  border:1px solid var(--amber);border-radius:999px;padding:1px 7px;flex:none}
.mrow .mbadge.cold{color:#3f6b4c;background:var(--sage-soft);border-color:var(--sage)}
.mrow .mrep{font-family:var(--mono);font-size:10.5px;color:var(--sage);flex:none}
.shopline{display:block;width:100%;text-align:left;cursor:pointer;
  font-family:var(--mono);font-size:11px;color:#fff;background:var(--paprika);border:1px solid var(--paprika);
  border-radius:8px;padding:6px 9px;line-height:1.3}
.shopline.small{background:var(--paprika-soft);color:var(--paprika);border-style:dashed}
.stockline{display:block;width:100%;text-align:left;cursor:pointer;font-family:var(--mono);font-size:11px;
  color:#3f6b4c;background:var(--sage-soft);border:1px solid var(--sage);border-radius:8px;padding:6px 9px;line-height:1.3}
.stockrow{display:flex;align-items:center;gap:10px;padding:4px 0}
.stockrow .sn{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stockrow .sneed{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.stockrow input{width:82px;text-align:right;flex:none}
.stockrow .su{font-family:var(--mono);font-size:11.5px;color:var(--muted);width:56px}

/* ---------- month overview ---------- */
.meals{display:flex;flex-direction:column;gap:3px;min-width:0}
.mini{display:block;width:100%;height:16px;line-height:16px;text-align:left;background:transparent;border:0;
  padding:0;font:inherit;font-family:var(--display);font-weight:700;font-size:12px;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.mini{cursor:pointer}
button.mini:hover{text-decoration:underline}
.mini.cold{font-weight:500;color:var(--ink-2)}
.mini.again{font-family:var(--mono);font-size:11px;color:var(--sage)}
.tile.hascook .mini.again{color:#8c9a86}
.mini.none{visibility:hidden}

.scrim{position:fixed;inset:0;background:rgba(15,32,28,.55);display:grid;place-items:center;padding:20px;z-index:50}
.sheet{background:var(--tile);border-radius:16px;max-width:520px;width:100%;max-height:86vh;overflow:auto;padding:22px}
.sheet .x{float:right;background:transparent;border:0;font-size:22px;line-height:1;color:var(--muted);cursor:pointer}
.method{white-space:pre-wrap;font-size:14px;line-height:1.6;color:var(--ink-2)}
.pill.veg{color:#3f6b4c;border-color:var(--sage);background:var(--sage-soft)}
.pill.meat{color:var(--paprika);border-color:var(--paprika);background:var(--paprika-soft)}
.pill{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px;margin:0 5px 4px 0}

.trip{background:var(--tile);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.trip-hd{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px;background:var(--paprika);color:#fff}
.trip-hd .d{font-family:var(--display);font-weight:700;font-size:17px}
.trip-hd .m{font-family:var(--mono);font-size:11.5px;color:#f6d7d1}
.trip-hd.small{background:var(--paprika-soft);color:var(--ink);border-bottom:1px dashed var(--paprika)}
.trip-hd.small .m{color:var(--muted)}
.aisle{padding:12px 18px;border-top:1px solid var(--line-soft)}
.aisle:first-of-type{border-top:0}
.aisle h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:400}
.item{display:flex;gap:10px;align-items:flex-start;padding:5px 0;cursor:pointer}
.item input{margin:3px 0 0;width:16px;height:16px;accent-color:var(--ink);flex:none;cursor:pointer}
.item .q{font-family:var(--mono);font-size:13px;min-width:84px;font-variant-numeric:tabular-nums}
.item .n{font-size:14px}
.item .for{font-size:11.5px;color:var(--muted);margin-left:6px}
.item.done .q,.item.done .n{text-decoration:line-through;color:var(--muted)}
.warn{color:var(--paprika);font-size:11.5px;margin-left:6px}

.filters{display:flex;flex-direction:column;gap:8px;margin:4px 0 18px}
.frow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.flabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);width:96px;flex:none}
.fchip{font-family:var(--body);font-size:12.5px;font-weight:500;background:#fff;border:1px solid var(--line);color:var(--ink-2);border-radius:999px;padding:5px 12px;cursor:pointer}
.fchip:hover{border-color:var(--ink)}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
@media (max-width:700px){.flabel{width:100%}}
.rec-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:12px}
.rec{background:var(--tile);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
.rec.picked{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.rec h3{margin-bottom:6px}
.rec .meta{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin:8px 0 10px}
.ing{font-size:13px;color:var(--ink-2);display:flex;gap:8px;padding:2px 0}
.ing .q{font-family:var(--mono);color:var(--muted);min-width:74px;font-size:12px}
details{margin-top:10px}
summary{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.rec-actions{display:flex;gap:8px;margin-top:12px}
table{width:100%;border-collapse:collapse}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:400;padding:0 8px 6px 0}
td{padding:3px 8px 3px 0;vertical-align:top}
td input,td select{padding:6px 8px;font-size:13px}
.pantry-row td{padding-bottom:8px}
.keep{display:flex;align-items:center;gap:10px;padding:4px 0}
.keep .kn{flex:1;font-size:14px;min-width:0}
.keep input{width:78px;text-align:right}
.keep .kd{font-family:var(--mono);font-size:11.5px;color:var(--muted);width:34px}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;color:var(--ink-2);cursor:pointer;margin:0}
.check input{width:16px;height:16px;accent-color:var(--ink);cursor:pointer}
.slotcard{margin-bottom:12px}
.slotcard.off{opacity:.62}
.slot-hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}

@media (max-width:700px){
  .cal-head{display:none}
  .cal{grid-template-columns:1fr}
  .tile{min-height:0}
  .tile.pad{display:none}
  h1{font-size:24px}
  .drow{flex-direction:column;gap:6px}
  .dwhen{flex-direction:row;gap:8px;width:auto;align-items:baseline}
  .dside{width:100%}
  .mrow .mslot{width:56px}
  .top{flex-direction:column-reverse;align-items:flex-start}
}
</style>

<header>
  <div class="head-in">
    <div class="top">
      <div class="brand">
        <h1>Foodify</h1>
        <p id="tagline"></p>
      </div>
      <div class="langs" id="langs">
        <button data-lang="en" aria-pressed="true">EN</button>
        <button data-lang="cs" aria-pressed="false">CZ</button>
      </div>
    </div>
    <nav id="nav">
      <button data-tab="plan" aria-selected="true"></button>
      <button data-tab="shop" aria-selected="false"></button>
      <button data-tab="recipes" aria-selected="false"></button>
      <button data-tab="pantry" aria-selected="false"></button>
      <button data-tab="settings" aria-selected="false"></button>
    </nav>
  </div>
</header>

<div class="wrap">
  <section id="tab-plan" class="tab"></section>
  <section id="tab-shop" class="tab" hidden></section>
  <section id="tab-recipes" class="tab" hidden></section>
  <section id="tab-pantry" class="tab" hidden></section>
  <section id="tab-settings" class="tab" hidden></section>
</div>
<div id="modal"></div>

<script>
/* ============================================================
   Foodify — meal plan + shopping run generator (EN / CS)
   ============================================================ */
const SLOTS = ["breakfast","lunch","dinner"];
const AISLES = ["Produce","Meat & fish","Dairy & eggs","Bakery","Frozen","Pantry","Other"];
const SHELF = {"Produce":6,"Meat & fish":3,"Dairy & eggs":10,"Bakery":3,"Frozen":180,"Pantry":365,"Other":21};
const UNITS = ["g","kg","ml","l","pcs","tbsp","tsp","bunch","can","pack"];
const BASE = {g:["g",1],kg:["g",1000],ml:["ml",1],l:["ml",1000],pcs:["pcs",1],tbsp:["tbsp",1],tsp:["tsp",1],bunch:["bunch",1],can:["can",1],pack:["pack",1]};
const WHOLE = ["pcs","can","pack","bunch"];
// typed shorthands accepted in the paste box, both languages
const UNIT_ALIAS = {g:"g",gram:"g",gramů:"g",kg:"kg",ml:"ml",l:"l",dl:"l",
  pcs:"pcs",pc:"pcs",ks:"pcs",kus:"pcs",kusy:"pcs",
  tbsp:"tbsp","lžíce":"tbsp",lzice:"tbsp","lžic":"tbsp",
  tsp:"tsp","lžička":"tsp",lzicka:"tsp","lžičky":"tsp","lžiček":"tsp",
  bunch:"bunch",svazek:"bunch",can:"can",plechovka:"can",konzerva:"can",
  pack:"pack","balení":"pack",baleni:"pack"};

/* ---------- language ---------- */
const L = {
  en:{
    wd:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],
    mo:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],
    date:(d,m)=>d+" "+m,
    slot:{breakfast:"Breakfast",lunch:"Lunch",dinner:"Dinner",cold:"cold dinners"},
    ab:{breakfast:"B",lunch:"L",dinner:"D"},
    aisle:{"Produce":"Produce","Meat & fish":"Meat & fish","Dairy & eggs":"Dairy & eggs","Bakery":"Bakery","Frozen":"Frozen","Pantry":"Pantry","Other":"Other"},
    unit:{g:"g",kg:"kg",ml:"ml",l:"l",pcs:"pcs",tbsp:"tbsp",tsp:"tsp",bunch:"bunch",can:"can",pack:"pack"},
    people:n=>n+(n===1?" person":" people"),
    recipes:n=>n+(n===1?" recipe":" recipes"),
    runs:n=>n+(n===1?" run ahead":" runs ahead"),
    items:n=>n+" items",
    perBatch:n=>n+" portions per batch",
    maxRow:n=>"max "+n+(n===1?" meal":" meals")+" per batch",
    tagged:(n,s)=>n+(n===1?" recipe":" recipes")+" tagged for "+s.toLowerCase()+".",
    tagline:"Your recipes, turned into cooking days and dated shopping runs.",
    nav:{plan:"Plan",shop:"Shopping",recipes:"Recipes",pantry:"Pantry",settings:"Settings"},
    planEyebrow:"Cooking plan", nothingYet:"Nothing to cook yet",
    emptyPlanTitle:"Add a few recipes first",
    emptyPlanBody:"The plan fills your cooking days from the recipe shelf, then works out the shopping.",
    addRecipe:"Add a recipe", samples:"Load 10 sample recipes",
    planTitle:"Your cooking plan", rules:"Change the rules", reshuffle:"Reshuffle dishes",
    kSessions:"Cook sessions", kMeals:"Meals planned", kOpen:"Meals open", kRuns:"Shopping runs", kPortions:"Portions each",
    hintTap:"Tap a meal for the ingredients, the method, and to swap the dish.",
    viewWeek:"Week", viewMonth:"Month", todayLbl:"Today", tomorrowLbl:"Tomorrow",

  ["Pantry", /vývar|bujón|bujon|stock|broth|koření|mletá paprika|kari past|curry paste|passata|kokosov|coconut milk|krájená rajčata|chopped tomatoes|rajčata v konzervě|sušen/i],

];
const guessAisle = n => (GUESS.find(([,re]) => re.test(n)) || ["Other"])[0];

const MEAT_KEYS = ["chicken","pork","beef","fish","seafood","lamb","turkey"];
const MEAT_RE = {
  chicken:/chicken|kuř|kure/i,
  pork:/pork|vepřov|veprov|bacon|slanin|sausage|klobás|klobas|ham\b|šunk|sunk/i,
  beef:/beef|hovězí|hovezi|mince|mlet[éy] hovězí/i,
  fish:/salmon|tuna|cod|fish|losos|tuňák|tunak|treska|ryb/i,
  seafood:/shrimp|prawn|squid|kreve|mořsk|morsk/i,
  lamb:/lamb|jehněč|jehnec/i,
  turkey:/turkey|krůt|krut/i,
};
const MEAT_LABEL = {
  en:{chicken:"Chicken",pork:"Pork",beef:"Beef",fish:"Fish",seafood:"Seafood",lamb:"Lamb",turkey:"Turkey"},
  cs:{chicken:"Kuřecí",pork:"Vepřové",beef:"Hovězí",fish:"Ryba",seafood:"Mořské plody",lamb:"Jehněčí",turkey:"Krůtí"},
};
// look through a recipe's ingredients and name the meat, if there is one
function guessMeat(recipe){
  const text = [recipe.name, ...recipe.ingredients.map(i=>i.name)].join(" ");
  const k = MEAT_KEYS.find(key => MEAT_RE[key].test(text));
  return k ? MEAT_LABEL[S.lang][k] : "";
}
// how long an ingredient keeps: your own number if you set one, otherwise the aisle default
function shelfOf(name, aisle){
  const c = S.shelf[String(name).trim().toLowerCase()];
  return (c > 0) ? c : (SHELF[aisle] ?? 14);
}
function allIngredients(){
  const m = {};
  S.recipes.forEach(r => r.ingredients.forEach(i=>{
    const k = i.name.trim().toLowerCase();
    if (!m[k]) m[k] = {key:k, name:i.name.trim(), aisle:i.aisle || guessAisle(i.name)};
  }));
  return Object.values(m).sort((a,b)=> AISLES.indexOf(a.aisle)-AISLES.indexOf(b.aisle) || a.name.localeCompare(b.name));
}

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,"0");
const d2s = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function s2d(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d,12); }
function addDays(s,n){ const d=s2d(s); d.setDate(d.getDate()+n); return d2s(d); }
function wdIdx(s){ return (s2d(s).getDay()+6)%7; }
function diffDays(a,b){ return Math.round((s2d(b)-s2d(a))/864e5); }
function shortDate(s){ const d=s2d(s); return t().date(d.getDate(), t().mo[d.getMonth()]); }
function human(s){ return t().wd[wdIdx(s)]+" "+shortDate(s); }
const today = () => d2s(new Date());

/* ---------- numbers ---------- */
const round = n => Math.round(n*100)/100;
function fmtNum(n){
  let s = String(round(n)).replace(/\.0+$/,"");
  return S.lang==="cs" ? s.replace(".", ",") : s;
}
function ulabel(u, n=1){
  const f = t().unit[u];
  if (!f) return u;
  if (typeof f === "string") return f;
  return n===1 ? f[0] : (n<5 ? f[1] : f[2]);   // czech declines its measures
}
function fmtQty(q, base){
  if (base==="g"  && q>=1000) return fmtNum(q/1000)+" "+ulabel("kg",q/1000);
  if (base==="ml" && q>=1000) return fmtNum(q/1000)+" "+ulabel("l",q/1000);
  if (WHOLE.includes(base)){ const w = Math.ceil(q-0.001); return fmtNum(w)+" "+ulabel(base,w); }
  return fmtNum(q)+" "+ulabel(base,q);
}
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

   state
   ============================================================ */
const KEY = "foodify:v1", OLDKEYS = ["prepboard:v2", "prepboard:v1"];   // old keys still read, so nothing is lost
let S = null;

function blankState(){
  return {
    lang: (navigator.language||"en").toLowerCase().startsWith("cs") ? "cs" : "en",
    recipes: [], pantry: [], shelf: {},   // ingredient name -> days it keeps
    settings: {
      start: today(), horizon: 28, people: 2, noRepeat: 7, catRepeat: 2, capUnit: "meals",
      bigDays: [5], bigEvery: 1, smallOn: true, stockMode: "before",
      slots: {
        breakfast:{on:false, cookDays:[0,1,2,3,4,5,6], maxEat:1},
        lunch:    {on:true,  mode:"leftovers", cookDays:[0,2,4], maxEat:2},
        dinner:   {on:true,  mode:"own", cold:false, cookDays:[0,2,4,6], maxEat:4},
      },
    },
    view:"week", pins:{}, extraShop:[], skipShop:[], checked:{},
  };
}
// Claude's artifact storage when it exists, the browser's own store when hosted anywhere else
const store = {
  async get(k){
    if (window.storage) return window.storage.get(k);
    const v = localStorage.getItem(k);
    return v == null ? null : {key:k, value:v};
  },
  async set(k, v){
    if (window.storage) return window.storage.set(k, v);
    localStorage.setItem(k, v);
    return {key:k, value:v};
  },
};
async function load(){
  for (const k of [KEY, ...OLDKEYS]){
    try{ const r = await store.get(k); if (r) return migrate(JSON.parse(r.value)); }
    catch(e){ /* not stored yet */ }
  }
  return null;
}
function migrate(old){
  const b = blankState(), s = old.settings || {};
  const out = {...b, ...old, settings:{...b.settings, ...s}};
  if (!s.slots){
    out.settings.slots = JSON.parse(JSON.stringify(b.settings.slots));
    out.settings.slots.dinner.cookDays = s.cookDays || b.settings.slots.dinner.cookDays;
    out.settings.slots.dinner.maxEat = s.maxEat || b.settings.slots.dinner.maxEat;
    out.settings.people = s.portions || b.settings.people;
    out.pins = {};
  }
  for (const sl of SLOTS) out.settings.slots[sl] = {...b.settings.slots[sl], ...(out.settings.slots[sl]||{})};
  if (!s.capUnit){
    // the cap used to count days; a dinner that also feeds lunch is two meals now
    const carried = out.settings.slots.lunch.on && out.settings.slots.lunch.mode==="leftovers";
    out.settings.slots.dinner.maxEat = out.settings.slots.dinner.maxEat * (carried ? 2 : 1);
    out.settings.capUnit = "meals";
  }
  out.recipes = (out.recipes||[]).map(r => ({slots:["lunch","dinner"], notes:"", cold:false, category:"", protein:"", diet:"", ...r}));
  if (out.settings.catRepeat === undefined) out.settings.catRepeat = 2;
  out.shelf = out.shelf || {};
  // fields from the shared-library feature, which no longer exists
  ["libRepo","libPath","libName","libUrl","libSources","myLibGist","myLibAt"].forEach(k=>delete out[k]);
  if (s.shopDays && !s.bigDays){ out.settings.bigDays = s.shopDays; }   // one shopping list became two
  out.settings.bigEvery = out.settings.bigEvery || 1;
  if (out.settings.smallOn === undefined) out.settings.smallOn = true;
  if (!out.settings.stockMode) out.settings.stockMode = "before";
  out.lang = out.lang || b.lang;
  return out;
}
let saveTimer=null, applyingRemote=false;
function save(){
  if (!applyingRemote) S.updatedAt = Date.now();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await store.set(KEY, JSON.stringify(S)); }
    catch(e){ console.error("Could not save:", e); }
  }, 250);
  if (!applyingRemote) syncSoon();
}

/* ============================================================
   optional sync through a private gist
   the token lives in its own key so it can never reach an export
   ============================================================ */
const KEY_SYNC = "foodify:sync", OLDKEY_SYNC = "prepboard:sync", GIST_FILE = "foodify.json";
let SY = {token:"", gist:"", auto:true, lastSync:0};
async function loadSync(){
  for (const k of [KEY_SYNC, OLDKEY_SYNC]){
    try{
      const r = await store.get(k);
      if (!r) continue;
      SY = {...SY, ...JSON.parse(r.value)};
      if ("libToken" in SY){ delete SY.libToken; saveSync(); }   // credential for a removed feature
      return;
    }catch(e){}
  }
}
async function saveSync(){ try{ await store.set(KEY_SYNC, JSON.stringify(SY)); }catch(e){} }

async function gistCall(path, opts={}){
  const res = await fetch("https://api.github.com/gists"+path, {
    ...opts,
    headers:{Accept:"application/vnd.github+json", Authorization:"Bearer "+SY.token,
             "Content-Type":"application/json", ...(opts.headers||{})},
  });
  if (res.status===401 || res.status===403) throw new Error("auth");
  if (res.status===404) throw new Error("missing");
  if (!res.ok) throw new Error("http");
  return res.json();
}
const syncPayload = () => JSON.stringify({app:"foodify", version:2, updatedAt:S.updatedAt||0, data:S}, null, 2);

function syncErr(e){
  const T = t();
  return e && e.message==="auth" ? T.syncBadToken : e && e.message==="missing" ? T.syncNoGist : T.syncFail;
}
async function syncCreate(){
  const T = t();
  if (!SY.token) return toast(T.syncNoToken);
  try{
    const g = await gistCall("", {method:"POST", body:JSON.stringify({
      description:"Foodify", public:false, files:{[GIST_FILE]:{content:syncPayload()}}})});
    SY.gist = g.id; SY.lastSync = Date.now(); await saveSync();
    renderSettings(); toast(T.syncCreated);
  }catch(e){ toast(syncErr(e)); }
}
async function syncPush(quiet){
  const T = t();
  if (!SY.token || !SY.gist) return quiet ? null : toast(T.syncNoToken);
  try{
    await gistCall("/"+SY.gist, {method:"PATCH", body:JSON.stringify({files:{[GIST_FILE]:{content:syncPayload()}}})});
    SY.lastSync = Date.now(); await saveSync();
    if (!quiet){ renderSettings(); toast(T.syncPushed); }
  }catch(e){ if (!quiet) toast(syncErr(e)); }
}
async function syncPull(quiet){
  const T = t();
  if (!SY.token || !SY.gist) return quiet ? null : toast(T.syncNoToken);
  let remote;
  try{
    const g = await gistCall("/"+SY.gist);
    const file = g.files && g.files[GIST_FILE];
    if (!file) throw new Error("missing");
    remote = JSON.parse(file.content);
  }catch(e){ if (!quiet) toast(syncErr(e)); return; }

  const there = remote.updatedAt || 0, here = S.updatedAt || 0;
  if (there <= here){                       // nothing newer waiting for us
    if (!quiet && there < here) syncPush();
    else if (!quiet) toast(T.syncSame);
    return;
  }
  const localChangedSinceSync = here > (SY.lastSync || 0);
  if (localChangedSinceSync) return syncConflictSheet(remote);
  applyRemote(remote);
  if (!quiet) toast(T.syncPulled);
}
function applyRemote(remote){
  const data = remote && remote.data ? remote.data : remote;
  if (!data || !Array.isArray(data.recipes)) return;
  applyingRemote = true;
  S = migrate(data);
  S.updatedAt = remote.updatedAt || Date.now();
  SY.lastSync = Date.now(); saveSync();
  save();
  applyingRemote = false;
  refresh();
}
function syncConflictSheet(remote){
  const T = t();
  const when = ms => new Date(ms).toLocaleString(S.lang==="cs"?"cs":"en");
  document.getElementById("modal").innerHTML = `
    <div class="scrim">

        <h2>${T.syncConflict}</h2>
        <p class="sub" style="margin:8px 0 16px">${T.syncConflictSub(when(S.updatedAt||0), when(remote.updatedAt||0))}</p>
        <div class="row">
          <button class="btn" onclick='closeMeal();applyRemote(${JSON.stringify(JSON.stringify(remote))})'>${T.syncKeepRemote}</button>
          <button class="btn ghost" onclick="closeMeal();syncPush()">${T.syncKeepLocal}</button>
        </div>

}
let syncTimer = null;
function syncSoon(){
  if (!SY.auto || !SY.token || !SY.gist) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=>syncPush(true), 4000);
}
function setSync(k, v){ SY[k] = typeof v==="string" ? v.trim() : v; saveSync(); renderSettings(); }

/* ============================================================
   the planner
   ============================================================ */
function bigDates(){
  const st=S.settings, out=new Set();
  for (let i=0;i<st.horizon;i++){
    const d = addDays(st.start,i);
    if (!st.bigDays.includes(wdIdx(d)) || S.skipShop.includes(d)) continue;
    if (st.bigEvery > 1 && Math.floor(i/7) % st.bigEvery !== 0) continue;   // every other week
    out.add(d);
  }
  S.extraShop.forEach(d=>{ const k=diffDays(st.start,d); if (k>=0 && k<st.horizon) out.add(d); });
  return [...out].sort();
}

const recipesFor = slot => S.recipes.filter(r => (r.slots||["lunch","dinner"]).includes(slot));
const coldOn = () => S.settings.slots.dinner.on && S.settings.slots.dinner.cold;
const coldPool = () => recipesFor("dinner").filter(r => r.cold);
// cold-tagged recipes are held back for cold dinner days — unless the mode is off, then they are ordinary dinners
const hotPool = slot => (slot==="dinner" && coldOn()) ? recipesFor(slot).filter(r=>!r.cold) : recipesFor(slot);

const catOf = r => (r && r.category || "").trim().toLowerCase();
const meatOf = r => (r && r.protein || "").trim().toLowerCase();
function remember(memo, r, days){
  const a = memo.r[r.id] = memo.r[r.id] || [];
  days.forEach(d=>a.push(d));
  const c = catOf(r);
  if (c){ const b = memo.c[c] = memo.c[c] || []; days.forEach(d=>b.push(d)); }
  const m = meatOf(r);
  if (m){ const b = memo.m[m] = memo.m[m] || []; days.forEach(d=>b.push(d)); }
}
const nearestDay = (days, i) => { let n=Infinity; for (const d of days||[]) n=Math.min(n,Math.abs(i-d)); return n; };

// pick the dish that has been off the table longest, and least often —
// then prefer one whose category has also had a rest, so pasta does not follow pasta
function pickDish(pool, i, memo, noRepeat, catRepeat){
  const scored = pool.map(r=>({
    r,
    nearest: nearestDay(memo.r[r.id], i),
    catNear: catOf(r) ? nearestDay(memo.c[catOf(r)], i) : Infinity,
    meatNear: meatOf(r) ? nearestDay(memo.m[meatOf(r)], i) : Infinity,
    count: (memo.r[r.id]||[]).length,
  }));
  const recOk = c => c.nearest >= noRepeat;
  const catOk = c => !catRepeat || c.catNear >= catRepeat;
  // both rules, then category alone, then the dish alone, then whatever is left
  const list = [scored.filter(c=>recOk(c)&&catOk(c)), scored.filter(catOk), scored.filter(recOk), scored]
                 .find(tier => tier.length);
  list.sort((a,b)=> b.nearest-a.nearest || b.catNear-a.catNear || b.meatNear-a.meatNear || a.count-b.count);
  return list[0].r;
}

function planSlot(slot, cfg, pool, dates, cells, sessions, perDay, memo, maxSpan){
  const st = S.settings, n = dates.length;
  const isCook = i => cfg.cookDays.includes(wdIdx(dates[i]));
  let i = 0;
  while (i < n){
    if (!isCook(i)){ i++; continue; }
    let j=i+1; while (j<n && !isCook(j)) j++;
    const bridge = Math.min(j-i, n-i);
    const pinned = S.pins[dates[i]+"|"+slot];
    let r = pinned ? pool.find(x=>x.id===pinned) : null;
    if (!r) r = pickDish(pool, i, memo, st.noRepeat, st.catRepeat);
    // the cap is in meals; one cooking day may feed more than one meal
    const capMeals = Math.min(cfg.maxEat, r.maxEat || cfg.maxEat);
    const capDays = Math.max(1, Math.floor(capMeals / perDay));
    const span = Math.max(1, Math.min(bridge, capDays, maxSpan || Infinity));
    const sid = slot+"@"+dates[i];
    sessions.push({id:sid, kind:"cook", slot, date:dates[i], recipeId:r.id, span, consumers:span, cap:capMeals});
    cells[dates[i]][slot] = {kind:"cook", recipeId:r.id, sid, span, dayNo:1};
    for (let k=1;k<span;k++)
      cells[dates[i+k]][slot] = {kind:"again", recipeId:r.id, sid, span, dayNo:k+1};
    // remember every day it gets eaten, carried lunch included
    const days = [];
    for (let k=0;k<span+(perDay>1?1:0);k++) days.push(i+k);
    remember(memo, r, days);
    i += span;
  }
}

function buildPlan(){
  const st = S.settings, n = st.horizon;
  const dates = []; for (let i=0;i<n;i++) dates.push(addDays(st.start,i));
  const cells = {}; dates.forEach(d => cells[d]={});
  const sessions = [];
  const active = SLOTS.filter(s => st.slots[s].on);
  const missing = [];
  const memo = {r:{}, c:{}, m:{}};   // day indices per recipe, category and meat, shared across the meals

  const carried = st.slots.lunch.on && st.slots.lunch.mode==="leftovers" && st.slots.dinner.on;
  for (const slot of active){
    const cfg = st.slots[slot];
    if (slot==="lunch" && cfg.mode==="leftovers") continue;
    const pool = hotPool(slot);
    if (!pool.length){ missing.push(slot); continue; }
    // a dinner also feeds the next day's lunch when lunch runs on leftovers,
    // unless cold dinners break the chain — then the batch only cooks for its own day
    const cold = slot==="dinner" && cfg.cold;
    planSlot(slot, cfg, pool, dates, cells, sessions,
             (carried && slot==="dinner" && !cold) ? 2 : 1, memo, cold ? 1 : null);
  }

  // cold dinners fill the days you do not cook
  if (coldOn()){
    const cold = coldPool();
    if (!cold.length) missing.push("cold");
    else for (let i=0;i<n;i++){
      if (cells[dates[i]].dinner) continue;
      const pinned = S.pins[dates[i]+"|cold"];
      const r = (pinned && cold.find(x=>x.id===pinned)) || pickDish(cold, i, memo, st.noRepeat, st.catRepeat);
      const sid = "cold@"+dates[i];
      sessions.push({id:sid, kind:"cold", slot:"dinner", date:dates[i], recipeId:r.id, span:1, consumers:1, cap:1});
      cells[dates[i]].dinner = {kind:"cold", recipeId:r.id, sid, span:1, dayNo:1};
      remember(memo, r, [i]);
    }
  }
  if (st.slots.lunch.on && st.slots.lunch.mode==="leftovers"){
    if (!st.slots.dinner.on) missing.push("lunch");
    const byId = Object.fromEntries(sessions.map(s=>[s.id,s]));
    let lastHot = null;   // cold dinners are skipped over, not eaten again at lunch
    for (let i=1;i<n;i++){
      const prev = cells[dates[i-1]].dinner;
      if (prev && prev.kind!=="cold") lastHot = prev.sid;
      const s = lastHot ? byId[lastHot] : null;
      if (!s || s.consumers >= s.cap) continue;    // the batch is finished
      cells[dates[i]].lunch = {kind:"again", recipeId:s.recipeId, sid:s.id, carried:true};
      s.consumers++;
    }
  }
  for (const s of sessions){
    const r = S.recipes.find(x=>x.id===s.recipeId) || {servings:4};
    s.portions = s.consumers * st.people;
    s.factor = Math.max(1, Math.ceil((s.portions/(r.servings||1))*2)/2);
    s.made = s.factor * (r.servings||1);
  }
  const slotsCount = active.length || 1;
  const filled = dates.reduce((a,d)=> a + active.filter(s=>cells[d][s]).length, 0);
  const cookCount = sessions.filter(s=>s.kind!=="cold").length;
  const R = Object.fromEntries(S.recipes.map(r=>[r.id,r]));

  // meals sitting closer together than the category rule wants
  const seq = [];
  dates.forEach((d,i)=> active.forEach(sl=>{
    const c = cells[d][sl]; if (!c) return;
    const cat = catOf(R[c.recipeId]);
    if (cat) seq.push({i, cat, sid:c.sid});
  }));
  let catClashes = 0;
  if (st.catRepeat) for (let a=0;a<seq.length;a++){
    for (let b=0;b<a;b++){
      if (seq[a].sid===seq[b].sid) continue;                 // the same batch eaten again is not a repeat
      if (seq[a].cat===seq[b].cat && seq[a].i-seq[b].i < st.catRepeat){ catClashes++; break; }
    }
  }
  const meatFree = dates.reduce((acc,d)=> acc + active.filter(sl=>{
    const c = cells[d][sl]; return c && R[c.recipeId] && R[c.recipeId].diet;
  }).length, 0);

  return {dates, cells, sessions, active, missing, trips:buildTrips(sessions),
          filled, cookCount, catClashes, meatFree, gaps:slotsCount*n - filled};
}

function buildTrips(sessions){
  if (!sessions.length) return [];
  const st = S.settings;
  const ordered = [...sessions].sort((a,b)=> a.date<b.date?-1:1);

  let big = bigDates();
  const first = ordered[0].date;
  if (!big.some(d => diffDays(d, first) >= 0)){
    const auto = diffDays(st.start, first) >= 1 ? addDays(first,-1) : st.start;
    big = [auto, ...big].sort();
  }

  // what has to be bought, and how long each thing keeps
  const needs = [];
  for (const s of ordered){
    const r = S.recipes.find(x=>x.id===s.recipeId);
    if (!r) continue;
    for (const ing of r.ingredients){
      const [base,f] = BASE[ing.unit] || ["pcs",1];
      const aisle = ing.aisle || guessAisle(ing.name);
      needs.push({date:s.date, key:ing.name.trim().toLowerCase()+"|"+base, name:ing.name.trim(),
                  aisle, base, qty:ing.qty*f*s.factor, shelf:shelfOf(ing.name, aisle)});
    }
  }

  // pantry first
  const stock = {};
  for (const p of S.pantry){
    const [base,f] = BASE[p.unit] || ["pcs",1];
    const k = p.name.trim().toLowerCase()+"|"+base;
    stock[k] = (stock[k]||0) + p.qty*f;
  }
  const gross = needs.map(n=>({...n}));           // what the month asks for, before the cupboards
  for (const need of needs){
    const have = stock[need.key] || 0;
    if (have <= 0) continue;
    const used = Math.min(have, need.qty);
    need.qty -= used; stock[need.key] = have - used;
  }
  const live = needs.filter(n => n.qty > 0.0001);

  // anything a big shop can carry, a big shop carries
  const fitsBig = n => big.some(d => diffDays(d, n.date) >= 0 && diffDays(d, n.date) <= n.shelf);
  const orphans = live.filter(n => !fitsBig(n));

  // the fewest top-up trips that still catch every orphan:
  // each one is only good from (cook day - shelf) to (cook day), so take the earliest deadline each time
  const small = [];
  if (st.smallOn && orphans.length){
    const windows = orphans.map(n=>({
      lo: Math.max(0, diffDays(st.start, n.date) - n.shelf),
      hi: diffDays(st.start, n.date),
    })).sort((a,b)=> a.hi-b.hi);
    let covered = -1;
    for (const w of windows){
      if (w.lo > covered){ covered = w.hi; small.push(addDays(st.start, w.hi)); }
    }
  }

  const runs = [...big.map(d=>({date:d, kind:"big"})), ...small.map(d=>({date:d, kind:"small"}))]
    .sort((a,b)=> a.date<b.date?-1:1);

  // place each item: latest big run that still keeps it, else the latest top-up
  const place = list => {
    const byRun = {};
    let onBig = 0;
    for (const need of list){
      const before = runs.filter(r => diffDays(r.date, need.date) >= 0);
      const fresh  = before.filter(r => diffDays(r.date, need.date) <= need.shelf);
      let run = [...fresh].reverse().find(r => r.kind==="big")
             || fresh[fresh.length-1]
             || before[before.length-1]
             || runs[0];
      const stale = diffDays(run.date, need.date) > need.shelf;
      if (run.kind === "big" && !stale) onBig++;

      byRun[run.date] = byRun[run.date] || {};
      const it = byRun[run.date][need.key] = byRun[run.date][need.key] ||
        {name:need.name, aisle:need.aisle, base:need.base, shelf:need.shelf, qty:0, forDates:[], stale:false};
      it.qty += need.qty;
      if (!it.forDates.includes(need.date)) it.forDates.push(need.date);
      if (stale) it.stale = true;
    }
    return {byRun, onBig};
  };
  const {byRun, onBig} = place(live);
  const grossByRun = place(gross).byRun;        // the stock check asks about these, so it never erases itself

  const out = runs.filter(r => byRun[r.date] && Object.keys(byRun[r.date]).length).map(r=>{
    const items = Object.entries(byRun[r.date]).map(([key,v])=>({key,...v}))
      .sort((a,b)=> AISLES.indexOf(a.aisle)-AISLES.indexOf(b.aisle) || a.name.localeCompare(b.name));
    const ds = items.flatMap(i=>i.forDates).sort();
    const gross = Object.entries(grossByRun[r.date]||{}).map(([key,v])=>({key,...v}))
      .sort((a,b)=> AISLES.indexOf(a.aisle)-AISLES.indexOf(b.aisle) || a.name.localeCompare(b.name));
    return {date:r.date, kind:r.kind, items, gross, from:ds[0], to:ds[ds.length-1]};
  });
  let nb=0, ns=0;
  out.forEach(r => r.no = (r.kind==="big") ? ++nb : ++ns);
  out.onBig = onBig; out.totalItems = live.length;
  return out;
}

   rendering
   ============================================================ */
let PLAN=null;
function refresh(){
  PLAN = buildPlan();
  renderChrome(); renderPlan(); renderShop(); renderRecipes(); renderPantry(); renderSettings();
}
function renderChrome(){
  document.documentElement.lang = S.lang;
  document.getElementById("tagline").textContent = t().tagline;
  document.querySelectorAll("#nav button").forEach(b => b.textContent = t().nav[b.dataset.tab]);
  document.querySelectorAll("#langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang===S.lang));
}
function setLang(l){ S.lang = l; closeMeal(); save(); refresh(); }
document.getElementById("langs").addEventListener("click", e=>{ if (e.target.dataset.lang) setLang(e.target.dataset.lang); });

/* ---------- plan ---------- */
let weekIdx = null;
function renderPlan(){
  const el = document.getElementById("tab-plan"), st = S.settings, T = t();

  if (!S.recipes.length){
    el.innerHTML = `
      <div class="spread"><div><p class="eyebrow">${T.planEyebrow}</p><h2>${T.nothingYet}</h2></div></div>
      <div class="empty"><strong>${T.emptyPlanTitle}</strong>${T.emptyPlanBody}
        <div class="row" style="justify-content:center;margin-top:16px">
          <button class="btn" onclick="go('recipes')">${T.addRecipe}</button>
          <button class="btn ghost" onclick="loadSamples()">${T.samples}</button>
        </div></div>`;
    return;
  }

  const {dates, cells, sessions, active, trips, filled, gaps, missing} = PLAN;
  const R  = Object.fromEntries(S.recipes.map(r=>[r.id,r]));
  const SS = Object.fromEntries(sessions.map(x=>[x.id,x]));
  const shopBy = {}; trips.forEach(x=> shopBy[x.date]=x);
  const view = S.view==="month" ? "month" : "week";
  const inPlan = d => dates.includes(d);

  const stockOn = stockMap();
  const stockChip = d => stockOn[d]
    ? `<button class="stockline" onclick="openStock('${stockOn[d]}')">${T.stockChip}</button>` : "";
  const shopChip = d => {
    const x = shopBy[d];
    if (!x) return "";
    const label = x.kind==="big" ? T.shopChipBig(x.no, x.items.length) : T.shopChipSmall(x.no, x.items.length);
    return `<button class="shopline ${x.kind}" onclick="go('shop')">${label}</button>`;
  };

  // one meal, written the same way everywhere
  const meal = (date, slot, big) => {
    const c = cells[date][slot];
    if (!c) return `<div class="mrow none"><span class="mslot">${T.slot[slot]}</span><span class="mname">—</span></div>`;
    const r = R[c.recipeId] || {name:"—"};
    const cook = c.kind==="cook";
    const f = (SS[c.sid]||{factor:1}).factor;
    const badge = cook && big ? `<span class="mbadge">${T.cookBadge}${f!==1?" ×"+fmtNum(f):""}</span>`
                : c.kind==="cold" && big ? `<span class="mbadge cold">${T.coldPill.toLowerCase()}</span>`
                : (c.kind==="again" ? `<span class="mrep">${c.carried?"↩":c.dayNo+"/"+c.span}</span>` : "");
    return `<button class="mrow ${c.kind}" onclick="openMeal('${c.sid}')">
      <span class="mslot">${big?T.slot[slot]:T.ab[slot]}</span>
      <span class="mname">${esc(r.name)}</span>${badge}</button>`;
  };

  /* ---------- header ---------- */
  const warn = [missing.length ? T.missing(missing.map(m=>T.slot[m].toLowerCase()).join(" / ")) : "",
                PLAN.catClashes ? T.catClash(PLAN.catClashes) : ""].filter(Boolean).join(" ");
  const head = `
    <div class="spread">
      <div><p class="eyebrow">${human(st.start)} → ${human(addDays(st.start, st.horizon-1))} · ${T.people(st.people)}</p>
        <h2>${T.planTitle}</h2></div>
      <div class="row">
        <button class="fchip" aria-pressed="${view==='week'}" onclick="setView('week')">${T.viewWeek}</button>
        <button class="fchip" aria-pressed="${view==='month'}" onclick="setView('month')">${T.viewMonth}</button>
        <button class="btn ghost small" onclick="reshuffle()">${T.reshuffle}</button>
      </div>
    </div>
    <div class="strip">
      <div><div class="k">${T.kSessions}</div><div class="v num">${PLAN.cookCount}</div></div>
      <div><div class="k">${T.kBig}</div><div class="v num">${trips.filter(x=>x.kind==="big").length}<span style="font-size:13px;color:var(--muted)"> + ${trips.filter(x=>x.kind==="small").length}</span></div></div>
      <div><div class="k">${T.kOpen}</div><div class="v num">${gaps}</div></div>
    </div>
    <p class="hint" style="margin-bottom:${warn?"4px":"18px"}">${T.summaryLine(filled, PLAN.meatFree, st.people)}</p>
    ${warn ? `<p class="hint" style="margin:0 0 18px">${warn}</p>` : ""}`;

  /* ---------- week ---------- */
  if (view === "week"){
    const anchor = addDays(st.start, -wdIdx(st.start));                 // monday of the first week
    const weeks  = Math.ceil((wdIdx(st.start) + st.horizon) / 7);
    if (weekIdx === null){
      const i = inPlan(today()) ? Math.floor(diffDays(anchor, today())/7) : 0;
      weekIdx = Math.max(0, Math.min(weeks-1, i));
    }
    weekIdx = Math.max(0, Math.min(weeks-1, weekIdx));
    const wStart = addDays(anchor, weekIdx*7);
    const days = [...Array(7)].map((_,i)=>addDays(wStart,i)).filter(inPlan);

    // what am I cooking today and tomorrow
    const d0 = inPlan(today()) ? today() : dates[0];
    const d1 = inPlan(addDays(d0,1)) ? addDays(d0,1) : null;
    const nu = d => `
      <div class="nu">
        <p class="eyebrow" style="margin-bottom:8px">${d===today()?T.todayLbl:(d===addDays(today(),1)?T.tomorrowLbl:human(d))}</p>
        ${active.map(sl=>meal(d, sl, true)).join("") || `<p class="hint">${T.nothingDay}</p>`}
        ${shopChip(d)}${stockChip(d)}
      </div>`;

    const rows = days.map(d=>`
      <div class="drow ${active.some(sl=>cells[d][sl]&&cells[d][sl].kind==="cook")?"iscook":""} ${d===today()?"today":""}">
        <div class="dwhen"><span class="dwd">${T.wd[wdIdx(d)]}</span><span class="dnum">${shortDate(d)}</span></div>
        <div class="dmeals">${active.map(sl=>meal(d, sl, true)).join("")}</div>
        <div class="dside">${shopChip(d)}${stockChip(d)}</div>
      </div>`).join("");

    el.innerHTML = head + `
      <div class="nextup">${nu(d0)}${d1?nu(d1):""}</div>
      <div class="weeknav">
        <button class="btn ghost small" onclick="stepWeek(-1)" ${weekIdx===0?"disabled":""}>←</button>
        <span class="wlabel">${human(days[0])} – ${human(days[days.length-1])}</span>
        <button class="btn ghost small" onclick="stepWeek(1)" ${weekIdx>=weeks-1?"disabled":""}>→</button>
        <button class="btn ghost small" onclick="weekIdx=null;renderPlan()">${T.thisWeek}</button>
      </div>
      <div class="week">${rows}</div>
      <p class="hint">${T.hintTap}</p>`;
    return;
  }

  /* ---------- month: overview only, names on the days you act ---------- */
  let grid = "";
  for (let i=0;i<wdIdx(dates[0]);i++) grid += `<div class="tile pad"></div>`;
  for (const date of dates){
    const rows = active.map(sl=>{
      const c = cells[date][sl];
      if (!c) return `<div class="mini none"></div>`;
      const r = R[c.recipeId] || {name:""};
      if (c.kind==="again") return `<div class="mini again" title="${esc(r.name)}">↩</div>`;
      return `<button class="mini ${c.kind}" onclick="openMeal('${c.sid}')">${esc(r.name)}</button>`;
    }).join("");
    const x = shopBy[date];
    grid += `<div class="tile ${active.some(sl=>cells[date][sl]&&cells[date][sl].kind==="cook")?"hascook":""} ${x?"shopday":""} ${date===today()?"today":""}">
      ${x?`<div class="notch ${x.kind}">${x.kind==="big"?T.notchBig(x.no):T.notchSmall}</div>`:""}
      ${stockOn[date]?`<button class="notch stock" onclick="openStock('${stockOn[date]}')" title="${T.stockChip}">✓</button>`:""}
      <div class="date">${T.wd[wdIdx(date)]} ${shortDate(date)}</div>
      <div class="meals">${rows}</div></div>`;
  }
  el.innerHTML = head + `
    <div class="cal-head">${T.wd.map(w=>`<span>${w}</span>`).join("")}</div>
    <div class="cal">${grid}</div>
    <p class="hint">${T.hintTap}</p>`;
}
function setView(v){ S.view=v; save(); renderPlan(); }
function stepWeek(n){ weekIdx = (weekIdx===null?0:weekIdx)+n; renderPlan(); }

function reshuffle(){ S.recipes.push(S.recipes.shift()); S.pins={}; save(); refresh(); }

/* ---------- meal sheet ---------- */
function openMeal(sid){
  const T = t();
  const s = PLAN.sessions.find(x=>x.id===sid); if (!s) return;
  const r = S.recipes.find(x=>x.id===s.recipeId); if (!r) return;
  const eaten = [];
  for (const d of PLAN.dates) for (const slot of PLAN.active){
    const c = PLAN.cells[d][slot];
    if (c && c.sid===sid) eaten.push(T.slot[slot].toLowerCase()+" "+human(d));
  }
  const isCold = s.kind==="cold", thisSid = s.id;
  const pool = isCold ? coldPool() : hotPool(s.slot);
  const pinKey = s.date+"|"+(isCold ? "cold" : s.slot);
  document.getElementById("modal").innerHTML = `
    <div class="scrim" onclick="if(event.target===this)closeMeal()">
      <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(r.name)}">
        <button class="x" onclick="closeMeal()" aria-label="×">×</button>
        <p class="eyebrow">${isCold ? T.assembleOn(human(s.date)) : T.cookOn(T.slot[s.slot], human(s.date))}</p>
        <h2>${esc(r.name)}</h2>
        <p class="sub" style="margin:8px 0 14px">
          <span class="pill">${T.pBatch(fmtNum(s.factor))}</span>
          <span class="pill">${T.pPortions(fmtNum(s.made))}</span>
          <span class="pill">${T.pFeeds(s.consumers)}</span>${r.category?`<span class="pill">${esc(r.category)}</span>`:""}${r.diet?`<span class="pill veg">${r.diet==="vegan"?T.vegan:T.vegetarian}</span>`:""}${r.protein?`<span class="pill meat">${esc(r.protein)}</span>`:""}</p>
        <h3>${T.ingScaled}</h3>
        ${r.ingredients.map(i=>{
          const [base,f]=BASE[i.unit]||["pcs",1];
          return `<div class="ing"><span class="q">${fmtQty(i.qty*f*s.factor, base)}</span><span>${esc(i.name)}</span></div>`;
        }).join("")}
        <h3 style="margin-top:16px">${T.method}</h3>
        ${r.notes && r.notes.trim() ? `<div class="method">${esc(r.notes)}</div>`
          : `<p class="hint" style="margin:0">${T.noNotes} <button class="btn ghost small" onclick="closeMeal();go('recipes');edit('${r.id}')">${T.addThem}</button></p>`}
        <h3 style="margin-top:18px">${T.eatenAt}</h3>
        <p class="hint" style="margin:0">${eaten.join(" · ")}</p>
        <div class="field" style="margin:18px 0 0">
          <label for="swap">${T.swap}</label>
          <div class="row" style="margin-bottom:8px">
            <button class="btn ghost small" onclick="rerollMeal('${thisSid}')">${T.reroll}</button>
          </div>
          <select id="swap" onchange="pin('${pinKey}', this.value)">
            <option value="">${T.auto}</option>
            ${pool.map(x=>`<option value="${x.id}" ${x.id===r.id&&S.pins[pinKey]?"selected":""}>${esc(x.name)}</option>`).join("")}
          </select>
        </div>
      </div></div>`;
}
// a day for looking in the cupboards, tied to the next big shop
function stockMap(){
  const st = S.settings, out = {};
  if (!st.stockMode || st.stockMode==="off") return out;
  PLAN.trips.filter(x=>x.kind==="big").forEach(x=>{
    const d = st.stockMode==="before" ? addDays(x.date,-1) : x.date;
    if (PLAN.dates.includes(d)) out[d] = x.date;
  });
  return out;
}
const baseOf = u => (BASE[u] || ["pcs",1]);
function haveAtHome(key){
  return S.pantry.reduce((a,p)=>{
    const [base,f] = baseOf(p.unit);
    return a + ((p.name.trim().toLowerCase()+"|"+base)===key ? p.qty*f : 0);
  }, 0);
}
let stockDraft = {}, stockNames = {};
function openStock(runDate){
  const T = t();
  const trip = PLAN.trips.find(x=>x.date===runDate);
  if (!trip) return toast(T.stockNone);
  stockDraft = {}; stockNames = {};
  const groups = {};
  (trip.gross && trip.gross.length ? trip.gross : trip.items).forEach(it => { stockNames[it.key] = it.name; (groups[it.aisle] = groups[it.aisle]||[]).push(it); });

  const rows = AISLES.filter(a=>groups[a]).map(a=>`
    <div class="aisle" style="padding-left:0;padding-right:0"><h4>${T.aisle[a]}</h4>
      ${groups[a].map(it=>{
        const have = haveAtHome(it.key);
        return `<div class="stockrow">
          <span class="sn">${esc(it.name)}</span>
          <span class="sneed">${T.stockNeed} ${fmtQty(it.qty, it.base)}</span>
          <input type="number" step="any" min="0" value="${have>0?fmtNum(have):""}" placeholder="0"
                 oninput="stockDraft['${esc(it.key).replace(/'/g,"\\'")}']=this.value" aria-label="${T.stockHave}">
          <span class="su">${ulabel(it.base,2)}</span></div>`;
      }).join("")}
    </div>`).join("");

  document.getElementById("modal").innerHTML = `
    <div class="scrim" onclick="if(event.target===this)closeMeal()">
      <div class="sheet" role="dialog" aria-modal="true" aria-label="${T.stockSheet}">
        <button class="x" onclick="closeMeal()" aria-label="×">×</button>
        <p class="eyebrow">${T.stockTitle}</p>
        <h2>${T.stockSheet}</h2>
        <p class="sub" style="margin:6px 0 10px">${T.stockSheetSub(human(runDate))}</p>
        ${rows}
        <div class="row" style="margin-top:16px">
          <button class="btn" onclick="saveStock()">${T.stockSave}</button>
          <button class="btn ghost" onclick="closeMeal()">${T.cancel}</button>
        </div>
      </div></div>`;
}
function saveStock(){
  for (const [key, raw] of Object.entries(stockDraft)){
    const base = key.slice(key.lastIndexOf("|")+1);
    const qty = parseFloat(String(raw).replace(",",".")) || 0;
    S.pantry = S.pantry.filter(p => (p.name.trim().toLowerCase()+"|"+baseOf(p.unit)[0]) !== key);
    if (qty > 0) S.pantry.push({name: stockNames[key] || key.slice(0, key.lastIndexOf("|")), qty, unit: base});
  }
  stockDraft = {};
  closeMeal(); save(); refresh(); toast(t().stockSaved);
}
function closeMeal(){ const m=document.getElementById("modal"); if (m) m.innerHTML=""; }
// swap just this one meal for the next best alternative
function rerollMeal(sid){
  const T = t();
  const s = PLAN.sessions.find(x=>x.id===sid); if (!s) return;
  const cold = s.kind==="cold";
  const pool = (cold ? coldPool() : hotPool(s.slot)).filter(x=>x.id!==s.recipeId);
  if (!pool.length) return toast(T.noAlternative);

  // rebuild what the rest of the month is eating, ignoring this meal
  const memo = {r:{}, c:{}, m:{}};
  PLAN.dates.forEach((d,i)=> PLAN.active.forEach(sl=>{
    const c = PLAN.cells[d][sl];
    if (!c || c.sid===sid) return;
    const rec = S.recipes.find(x=>x.id===c.recipeId);
    if (rec) remember(memo, rec, [i]);
  }));

  const r = pickDish(pool, PLAN.dates.indexOf(s.date), memo, S.settings.noRepeat, S.settings.catRepeat);
  S.pins[s.date+"|"+(cold?"cold":s.slot)] = r.id;
  save(); refresh();
  toast(T.rerolled(r.name));
  openMeal(sid);
}
function pin(key, rid){ if (rid) S.pins[key]=rid; else delete S.pins[key]; closeMeal(); save(); refresh(); }

function matchesFilter(r){
  const cat = (r.category||"").trim(), meat = (r.protein||"").trim();
  if (F.cat === "__none"){ if (cat) return false; }
  else if (F.cat && cat !== F.cat) return false;
  if (F.prot === "__veg"){ if (!r.diet) return false; }
  else if (F.prot === "__vegan"){ if (r.diet !== "vegan") return false; }
  else if (F.prot === "__nometa"){ if (meat || r.diet) return false; }
  else if (F.prot && meat !== F.prot) return false;
  return true;
}

function parseNum(x){
  if (/^\d+\/\d+$/.test(x)){ const [a,b]=x.split("/").map(Number); return a/b; }
  const n = parseFloat(x.replace(",",".")); return isNaN(n) ? null : n;
}
function parsePaste(){
  const box = document.getElementById("paste");
  box.value.split("\n").map(l=>l.trim()).filter(Boolean).forEach(line=>{
    const parts = line.split(/\s+/);

    const n = parseNum(parts[0]);
    if (n !== null){
      qty=n; parts.shift();
      const u = parts.length ? UNIT_ALIAS[parts[0].toLowerCase().replace(/\.$/,"")] : null;
      if (u){ unit = u; if (parts[0].toLowerCase().startsWith("dl")) qty = qty/10; parts.shift(); }
    }
    const name = parts.join(" ").trim();
    if (name) editing.ingredients.push({qty, unit, name, aisle:guessAisle(name)});
  });

/* ============================================================
   shared library — read-only, anything fetched is untrusted
   ============================================================ */
const clip = (v,n) => typeof v==="string" ? v.trim().slice(0,n) : "";
const num  = (v,lo,hi,dflt) => { const n = parseFloat(v); return isFinite(n) && n>=lo && n<=hi ? n : dflt; };

// a recipe from outside is data, never settings — everything is checked and clamped
function sanitizeRecipe(raw){
  if (!raw || typeof raw !== "object") return null;
  const name = clip(raw.name, 120);
  if (!name) return null;
  const ings = Array.isArray(raw.ingredients) ? raw.ingredients.slice(0,60) : [];
  const ingredients = ings.map(i=>{
    if (!i || typeof i !== "object") return null;
    const n = clip(i.name, 80);
    if (!n) return null;
    return {
      qty: num(i.qty, 0, 100000, 1),
      unit: UNITS.includes(i.unit) ? i.unit : (UNIT_ALIAS[String(i.unit).toLowerCase()] || "pcs"),
      name: n,
      aisle: AISLES.includes(i.aisle) ? i.aisle : guessAisle(n),
    };
  }).filter(Boolean);
  if (!ingredients.length) return null;
  const slots = Array.isArray(raw.slots) ? raw.slots.filter(x=>SLOTS.includes(x)) : [];
  return {
    id: uid(),
    name,
    servings: Math.round(num(raw.servings, 1, 99, 4)),
    category: clip(raw.category, 40),
    protein: clip(raw.protein, 40),
    diet: raw.diet==="vegan" ? "vegan" : raw.diet==="vegetarian" ? "vegetarian" : "",
    slots: slots.length ? slots : ["lunch","dinner"],
    cold: !!raw.cold,
    maxEat: raw.maxEat ? Math.round(num(raw.maxEat, 1, 14, 1)) : null,
    notes: clip(raw.notes, 4000),
    author: clip(raw.author, 60),
    lang: clip(raw.lang, 5),
    ingredients,
  };
}
const mine = () => new Set(S.recipes.map(r=>r.name.trim().toLowerCase()));

/* ---------- share one recipe as a link ---------- */
const b64  = str => btoa(String.fromCharCode(...new TextEncoder().encode(str))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64 = str => new TextDecoder().decode(Uint8Array.from(atob(str.replace(/-/g,"+").replace(/_/g,"/")), c=>c.charCodeAt(0)));
function shareRecipe(id){
  const T = t();
  const r = S.recipes.find(x=>x.id===id);
  if (!r) return;
  const {id:_drop, ...rest} = r;
  const link = location.origin + location.pathname + "#r=" + b64(JSON.stringify(rest));
  navigator.clipboard.writeText(link).then(()=>toast(T.libShareDone), ()=>toast(T.copyBlocked));
}
function checkSharedLink(){
  const m = (location.hash||"").match(/^#r=(.+)$/);
  if (!m) return;
  let r = null;
  try{ r = sanitizeRecipe(JSON.parse(unb64(m[1]))); }catch(e){ r = null; }
  history.replaceState(null, "", location.pathname + location.search);
  if (!r) return;
  const T = t();
  document.getElementById("modal").innerHTML = `
    <div class="scrim" onclick="if(event.target===this)closeMeal()">
      <div class="sheet" role="dialog" aria-modal="true">
        <button class="x" onclick="closeMeal()" aria-label="×">×</button>
        <p class="eyebrow">${T.libEyebrow}</p>
        <h2>${esc(r.name)}</h2>
        <p class="sub" style="margin:6px 0 12px">${T.importAsk(esc(r.name))}</p>
        ${r.ingredients.map(i=>`<div class="ing"><span class="q">${fmtNum(i.qty)} ${ulabel(i.unit,i.qty)}</span><span>${esc(i.name)}</span></div>`).join("")}
        <div class="row" style="margin-top:18px">
          <button class="btn" onclick='acceptShared(${JSON.stringify(JSON.stringify(r))})'>${T.importBtn}</button>
          <button class="btn ghost" onclick="closeMeal()">${T.cancel}</button>
        </div>
      </div></div>`;
}
function acceptShared(json){
  const r = sanitizeRecipe(JSON.parse(json));
  if (!r) return;
  if (mine().has(r.name.trim().toLowerCase())) { closeMeal(); return toast(t().libAdded(0)); }
  S.recipes.push({...r, id: uid()});
  closeMeal(); save(); refresh(); go("recipes"); toast(t().libAdded(1));
}

function panDel(i){ S.pantry.splice(i,1); save(); refresh(); }

function slotCard(slot){
  const T = t(), cfg = S.settings.slots[slot], count = recipesFor(slot).length;
  const leftovers = slot==="lunch" && cfg.mode==="leftovers";
  const carries = slot==="dinner" && !cfg.cold && S.settings.slots.lunch.on && S.settings.slots.lunch.mode==="leftovers";
  // what the plan actually reaches — the cooking days may cap it before the number does
  const mine = (PLAN ? PLAN.sessions : []).filter(x=>x.slot===slot);
  const reached = mine.length ? Math.max(...mine.map(x=>x.consumers)) : 0;
  const days = T.wd.map((w,i)=>`<button class="wd" aria-pressed="${cfg.cookDays.includes(i)}" onclick="toggleCook('${slot}',${i})">${w}</button>`).join("");
  return `<div class="card slotcard ${cfg.on?"":"off"}">
    <div class="slot-hd"><h3 style="margin:0">${T.slot[slot]}</h3>
      <label class="check"><input type="checkbox" ${cfg.on?"checked":""} onchange="toggleSlot('${slot}',this.checked)">${cfg.on?T.on:T.off}</label></div>
    ${!cfg.on ? `<p class="hint" style="margin:0">${T.notPlanned}</p>` : `
      ${slot==="lunch" ? `
        <div class="field"><label for="lm">${T.lunchSource}</label>
          <select id="lm" onchange="setSlot('lunch','mode',this.value)">
            <option value="leftovers" ${leftovers?"selected":""}>${T.optLeftovers}</option>
            <option value="own" ${leftovers?"":"selected"}>${T.optOwn}</option>
          </select>
          <div class="hint">${leftovers?T.hintLeftovers:T.hintOwn}</div>
        </div>`:""}
      ${slot==="dinner" ? `
        <div class="field">
          <label class="check"><input type="checkbox" ${cfg.cold?"checked":""} onchange="setCold(this.checked)">${T.coldToggle}</label>
          <div class="hint">${T.coldHint}${cfg.cold?" "+T.coldTagged(coldPool().length):""}</div>
        </div>`:""}
      ${leftovers ? "" : `
        <label>${T.cookingDays}</label>
        <div class="wd-set" style="margin-bottom:14px">${days}</div>
        <div class="grid2"><div class="field"><label>${T.maxRowLabel}</label>
          <input type="number" min="${carries?2:1}" step="${carries?2:1}" max="14" value="${cfg.maxEat}" onchange="setCap('${slot}',this.value)">
          <div class="hint">${cfg.cold&&slot==="dinner"?T.maxRowHintCold:carries?T.maxRowHintCarry:T.maxRowHint}${reached && cfg.maxEat>reached ? " "+T.capUnused(reached) : ""}</div></div></div>
        <p class="hint" style="margin-top:0">${T.tagged(count, T.slot[slot])}</p>`}
    `}</div>`;
}

function setNum(k,v){ S.settings[k]=v; save(); refresh(); }
function setSlot(slot,k,v){ S.settings.slots[slot][k]=v; save(); refresh(); }
function setCold(on){
  S.settings.slots.dinner.cold = on;
  const cap = S.settings.slots.dinner;
  if (on && cap.maxEat > 1) cap.maxEat = Math.max(1, cap.maxEat - 1);   // the hot dinner no longer covers two evenings
  save(); refresh();
}
function mealsPerCookDay(slot){
  const st = S.settings;
  return (slot==="dinner" && !st.slots.dinner.cold && st.slots.lunch.on && st.slots.lunch.mode==="leftovers" && st.slots.dinner.on) ? 2 : 1;
}
function setCap(slot, raw){
  const per = mealsPerCookDay(slot);
  const asked = +raw || per;
  const n = Math.max(per, Math.floor(asked/per)*per);   // half a cooking day is not a thing
  S.settings.slots[slot].maxEat = n;
  save(); refresh();
  if (n !== asked) toast(t().capSnapped(n));
}
function toggleSlot(slot,on){ S.settings.slots[slot].on=on; save(); refresh(); }
function toggleCook(slot,i){
  const a = S.settings.slots[slot].cookDays, at=a.indexOf(i);
  if (at>=0) a.splice(at,1); else a.push(i);
  a.sort((x,y)=>x-y); save(); refresh();
}
function toggleShop(i){
  const a = S.settings.bigDays, at=a.indexOf(i);
  if (at>=0) a.splice(at,1); else a.push(i);
  a.sort((x,y)=>x-y); save(); refresh();
}
function addExtra(){
  const v = document.getElementById("ex").value;
  if (!v) return toast(t().pickDate);
  if (!S.extraShop.includes(v)) S.extraShop.push(v);
  save(); refresh();
}
function dropExtra(d){ S.extraShop = S.extraShop.filter(x=>x!==d); save(); refresh(); }
function resetAll(){
  if (!confirm(t().resetConfirm)) return;
  const lang = S.lang;
  S = blankState(); S.lang = lang; save(); refresh(); go("plan");
}

/* ---------- backup: export / import ---------- */
function exportPayload(){
  return JSON.stringify({app:"foodify", version:2, exported:new Date().toISOString(), data:S}, null, 2);
}
function exportSheet(){
  const T = t(), json = exportPayload();
  document.getElementById("modal").innerHTML = `
    <div class="scrim" onclick="if(event.target===this)closeMeal()">
      <div class="sheet" role="dialog" aria-modal="true" aria-label="${T.exportTitle}">
        <button class="x" onclick="closeMeal()" aria-label="×">×</button>
        <p class="eyebrow">${T.dataTitle}</p>
        <h2>${T.exportTitle}</h2>
        <p class="sub" style="margin:6px 0 14px">${T.exportCount(S.recipes.length, S.pantry.length)}</p>
        <textarea id="exp" class="mono" rows="9" readonly onclick="this.select()">${esc(json)}</textarea>
        <div class="row" style="margin-top:14px">
          <button class="btn" onclick="downloadJson()">${T.download}</button>
          <button class="btn ghost" onclick="copyJson()">${T.copyJson}</button>
        </div>
      </div></div>`;
}
function downloadJson(){
  const T = t();
  try{
    const blob = new Blob([exportPayload()], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "foodify-"+today()+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  }catch(e){ toast(T.downloadBlocked); }
}
function copyJson(){
  const T = t();
  navigator.clipboard.writeText(exportPayload()).then(()=>toast(T.copied), ()=>{
    const box = document.getElementById("exp"); if (box){ box.focus(); box.select(); }
    toast(T.copyBlocked);
  });
}

function importSheet(){
  const T = t();
  document.getElementById("modal").innerHTML = `
    <div class="scrim" onclick="if(event.target===this)closeMeal()">
      <div class="sheet" role="dialog" aria-modal="true" aria-label="${T.importTitle}">
        <button class="x" onclick="closeMeal()" aria-label="×">×</button>
        <p class="eyebrow">${T.dataTitle}</p>
        <h2>${T.importTitle}</h2>
        <div class="field" style="margin-top:14px">
          <label for="impfile">${T.chooseFile}</label>
          <input id="impfile" type="file" accept="application/json,.json" onchange="readImportFile(this)">
        </div>
        <div class="field">
          <label for="imp">${T.orPaste}</label>
          <textarea id="imp" class="mono" rows="6" placeholder='{"app":"foodify", ...}'></textarea>
        </div>
        <div class="field">
          <label>${T.mode}</label>
          <label class="check" style="margin-bottom:6px"><input type="radio" name="impmode" value="replace" checked>${T.modeReplace}</label>
          <label class="check"><input type="radio" name="impmode" value="merge">${T.modeMerge}</label>
        </div>
        <div class="row" style="margin-top:16px">
          <button class="btn" onclick="doImport()">${T.doImport}</button>
          <button class="btn ghost" onclick="closeMeal()">${T.cancel}</button>
        </div>
      </div></div>`;
}
function readImportFile(input){
  const f = input.files && input.files[0];
  if (!f) return;
  const fr = new FileReader();
  fr.onload = () => { const box = document.getElementById("imp"); if (box) box.value = fr.result; };
  fr.readAsText(f);
}
function doImport(){
  const T = t(), box = document.getElementById("imp");
  const raw = (box ? box.value : "").trim();
  if (!raw) return toast(T.importEmpty);
  let parsed;
  try{ parsed = JSON.parse(raw); }catch(e){ return toast(T.importBad); }

  const incoming = parsed && parsed.data ? parsed.data : parsed;   // wrapped or bare state
  if (!incoming || !Array.isArray(incoming.recipes)) return toast(T.importBad);

  const mode = (document.querySelector('input[name="impmode"]:checked')||{}).value || "replace";

  if (mode === "merge"){
    const have = new Set(S.recipes.map(r => r.name.trim().toLowerCase()));
    let added = 0;
    for (const r of incoming.recipes){
      if (!r || !r.name || have.has(r.name.trim().toLowerCase())) continue;
      S.recipes.push({...r, id: uid(), slots: r.slots || ["lunch","dinner"], notes: r.notes || ""});
      have.add(r.name.trim().toLowerCase());
      added++;
    }
    closeMeal(); save(); refresh(); go("recipes");
    return toast(T.importAdded(added));
  }

  const lang = S.lang;
  S = migrate(incoming);
  S.lang = incoming.lang || lang;
  if (diffDays(S.settings.start, today()) > S.settings.horizon) S.settings.start = today();
  closeMeal(); save(); refresh(); go("plan");
  toast(T.importReplaced);
}

/* ---------- tabs ---------- */
function go(tab){
  document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===tab));
  document.querySelectorAll(".tab").forEach(s=> s.hidden = (s.id !== "tab-"+tab));
  window.scrollTo({top:0});
}
document.getElementById("nav").addEventListener("click", e=>{ if (e.target.dataset.tab) go(e.target.dataset.tab); });

    S.recipes.push({id:uid(), name, servings, category, maxEat:null, slots, notes, cold:!!cold,
      diet: SAMPLE_DIET[name] || "",
      protein: SAMPLE_MEAT[name] ? MEAT_LABEL[S.lang][SAMPLE_MEAT[name]] : "",
      ingredients: lines.map(([qty,unit,n])=>({qty, unit: UNIT_ALIAS[unit]||unit, name:n, aisle:guessAisle(n)}))});
